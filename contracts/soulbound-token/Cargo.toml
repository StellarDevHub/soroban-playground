[package]
name = "soroban-soulbound-token"
version = "0.1.0"
edition = "2021"
description = "Non-transferable (soulbound) credential token with issuer attestations, expiration tracking and social recovery for Soroban"

[lib]
crate-type = ["cdylib"]

[dependencies]
soroban-sdk = "21.0.6"

[dev-dependencies]
soroban-sdk = { version = "21.0.6", features = ["testutils"] }
ed25519-dalek = "2"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
