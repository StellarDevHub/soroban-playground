[package]
name = "soroban-stellar-naming-service"
version = "0.1.0"
edition = "2021"
description = "Stellar Naming Service (.xlm) with reverse resolution and Vickrey auctions"

[lib]
crate-type = ["cdylib"]

[dependencies]
soroban-sdk = "21.0.6"

[dev-dependencies]
soroban-sdk = { version = "21.0.6", features = ["testutils"] }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
codegen-units = 1
lto = true
panic = "abort"
