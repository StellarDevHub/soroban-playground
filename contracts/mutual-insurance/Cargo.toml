[package]
name = "soroban-mutual-insurance"
version = "0.1.0"
edition = "2021"
description = "P2P mutual insurance protocol with risk-sharing pools, claim assessment voting, and solvency margin enforcement"

[lib]
crate-type = ["cdylib"]

[dependencies]
soroban-sdk = "21.0.6"

[dev-dependencies]
soroban-sdk = { version = "21.0.6", features = ["testutils"] }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
